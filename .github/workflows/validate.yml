name: Offline release validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web-and-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      SAMSUNG_TV_TOOLKIT: ${{ github.workspace }}/.ci/empty-tv-toolkit
      TV_SETUP_STATE: ${{ github.workspace }}/.ci/tv-state
      PYTHONWARNINGS: default
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        if: matrix.python == '3.12'
        with:
          node-version: '22'
      # Hosted runners may have .NET preinstalled. Fail if this job invokes it.
      - name: Block managed tooling in the SDK-free checks
        run: |
          mkdir -p "$RUNNER_TEMP/no-dotnet"
          cat > "$RUNNER_TEMP/no-dotnet/dotnet" <<'SH'
          #!/bin/sh
          touch "$RUNNER_TEMP/dotnet-invoked"
          echo '.NET belongs in the managed job' >&2
          exit 1
          SH
          chmod +x "$RUNNER_TEMP/no-dotnet/dotnet"
          echo "$RUNNER_TEMP/no-dotnet" >> "$GITHUB_PATH"
      - run: python -m pip install -r tvsetup/requirements.txt
      - run: python scripts/check-dependencies.py --component offline
      - run: python scripts/check-dependencies.py --component web
        if: matrix.python == '3.12'
      - run: python scripts/privacy-audit.py --check
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: python -m unittest discover -s research/s90d-telemetry/tests
      - run: npm ci
        if: matrix.python == '3.12'
      - run: npx playwright install --with-deps chromium
        if: matrix.python == '3.12'
      - run: python -m unittest discover -s native/webview/tests -p 'test_*.py'
      - run: node native/webview/tests/native-shim.cjs
        if: matrix.python == '3.12'
      - run: node native/webview/tests/diagnostic.cjs
        if: matrix.python == '3.12'
      - run: npm test
        if: matrix.python == '3.12'
      - run: python scripts/check-reproducible.py --component web
        if: matrix.python == '3.12'
      - name: Verify no managed tooling was invoked
        run: test ! -e "$RUNNER_TEMP/dotnet-invoked"
  managed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      SAMSUNG_TV_TOOLKIT: ${{ github.workspace }}/.ci/empty-tv-toolkit
      TV_SETUP_STATE: ${{ github.workspace }}/.ci/tv-state
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: python scripts/check-dependencies.py --component managed
      - run: python tests/telemetry_service_test.py
      - run: python tests/inspector_collector_test.py
      - run: python tests/root_agent_worker_test.py
      - run: python tests/qn90a_boot_relay_test.py
      - run: python scripts/check-reproducible.py --component managed
  root-native-launcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: docker build -t samsung-native-collector:bullseye research/native-telemetry/collector
      - run: python3 scripts/check-root-launcher.py
      - name: Native collector host checks
        run: |
          mkdir -p test-results/native-telemetry
          docker run --rm --pull never --network none -v "$PWD:/src:ro" -v "$PWD/test-results/native-telemetry:/out" -e OUTPUT_DIR=/out samsung-native-collector:bullseye sh research/native-telemetry/collector/build.sh --host-only
          docker run --rm --pull never --network none -v "$PWD:/src:ro" -v "$PWD/test-results/native-telemetry:/out:ro" samsung-native-collector:bullseye python3 research/native-telemetry/collector/test_collector.py
      - name: Native worker protocol and recovery checks
        run: |
          mkdir -p test-results/native-worker
          docker run --rm --init --pull never --network none --cap-add SYS_PTRACE --security-opt seccomp=unconfined -v "$PWD:/src:ro" -v "$PWD/test-results/native-worker:/out" samsung-native-collector:bullseye sh -eu -c '
            gcc -std=c99 -O2 -Wall -Wextra -Werror -Wno-unused-function -DNATIVE_WORKER_TEST -DNATIVE_WORKER_FAULT_TEST research/autonomous-root/native-worker/worker.c -ldl -pthread -o /out/worker
            NATIVE_WORKER=/out/worker NATIVE_WORKER_FAULT_TEST=1 python3 -m unittest discover -s tests -p native_worker_test.py
          '
      - run: dotnet build tests/root-agent-harness/Harness.csproj -c Release
      - run: docker run --rm --network none -v "$PWD/tests/root-agent-harness/bin/Release/net10.0:/app:ro" mcr.microsoft.com/dotnet/sdk:10.0.301-noble dotnet /app/Harness.dll
  qn90a-web-saver:
    runs-on: ubuntu-24.04
    container: emscripten/emsdk:3.1.64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/check-web-reproducible.py
# No device credentials, vendor GLES libraries, signing, deployment or publishing.
