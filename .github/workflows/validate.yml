name: Offline release validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      SAMSUNG_TV_TOOLKIT: ${{ github.workspace }}/.ci/empty-tv-toolkit
      TV_SETUP_STATE: ${{ github.workspace }}/.ci/tv-state
      PYTHONWARNINGS: default
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: python -m pip install -r tvsetup/requirements.txt
      - run: python scripts/check-dependencies.py
      - run: python scripts/privacy-audit.py --check
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: python -m unittest discover -s research/s90d-telemetry/tests
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python -m unittest discover -s native/webview/tests -p 'test_*.py'
      - run: node native/webview/tests/native-shim.cjs
      - run: node native/webview/tests/diagnostic.cjs
      - run: npm test
      - run: python scripts/check-reproducible.py
      - run: python tests/qn90a_boot_relay_test.py
      - run: python scripts/package.py
  root-native-launcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: docker build -t samsung-native-collector:bullseye research/native-telemetry/collector
      - run: python3 scripts/check-root-launcher.py
  qn90a-web-saver:
    runs-on: ubuntu-24.04
    container: emscripten/emsdk:3.1.64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/check-web-reproducible.py
# No device credentials, vendor GLES libraries, signing, deployment or publishing.
